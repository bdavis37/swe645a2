<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Survey</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .checkbox-group,
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-group label,
        .radio-group label {
            font-weight: normal;
            display: inline-block;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #2e7d32;
            color: white;
        }

        .cancel-btn {
            background-color: #c62828;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Survey</h1>

    <form action="#" method="post">

        <!-- Personal Information -->
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
            <label for="streetAddress">Street Address:</label>
            <input type="text" id="streetAddress" name="streetAddress" required>
        </div>

        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>
        </div>

        <div class="form-group">
            <label for="state">State:</label>
            <input type="text" id="state" name="state" required>
        </div>

        <div class="form-group">
            <label for="zip">Zip:</label>
            <input type="text" id="zip" name="zip" required>
        </div>

        <div class="form-group">
            <label for="telephone">Telephone Number:</label>
            <input type="tel" id="telephone" name="telephone" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="surveyDate">Date of Survey:</label>
            <input type="date" id="surveyDate" name="surveyDate" required>
        </div>

        <!-- Campus Preferences -->
        <div class="form-group">
            <label>What did you like most about the campus?</label>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="liked[]" value="students">
                    Students
                </label>

                <label>
                    <input type="checkbox" name="liked[]" value="location">
                    Location
                </label>

                <label>
                    <input type="checkbox" name="liked[]" value="campus">
                    Campus
                </label>

                <label>
                    <input type="checkbox" name="liked[]" value="atmosphere">
                    Atmosphere
                </label>

                <label>
                    <input type="checkbox" name="liked[]" value="dorm rooms">
                    Dorm Rooms
                </label>

                <label>
                    <input type="checkbox" name="liked[]" value="sports">
                    Sports
                </label>
            </div>
        </div>

        <!-- Interest -->
        <div class="form-group">
            <label>How did you become interested in the university?</label>

            <div class="radio-group">
                <label>
                    <input type="radio" name="interest" value="friends">
                    Friends
                </label>

                <label>
                    <input type="radio" name="interest" value="television">
                    Television
                </label>

                <label>
                    <input type="radio" name="interest" value="internet">
                    Internet
                </label>

                <label>
                    <input type="radio" name="interest" value="other">
                    Other
                </label>
            </div>
        </div>

        <!-- Recommendation -->
        <div class="form-group">
            <label for="recommend">
                How likely are you to recommend this school to other prospective students?
            </label>

            <select id="recommend" name="recommend">
                <option value="very-likely">Very Likely</option>
                <option value="likely">Likely</option>
                <option value="unlikely">Unlikely</option>
            </select>
        </div>

        <!-- Raffle -->
        <div class="form-group">
            <label for="raffle">
                Raffle: Enter at least ten comma-separated numbers from 1 through 100:
            </label>

            <input
                type="text"
                id="raffle"
                name="raffle"
                placeholder="Example: 5, 12, 23, 34, 45, 56, 67, 78, 89, 100"
                required
            >
        </div>

        <!-- Comments -->
        <div class="form-group">
            <label for="comments">Additional Comments:</label>

            <textarea
                id="comments"
                name="comments"
                placeholder="Enter any additional comments here..."
            ></textarea>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button type="submit" class="submit-btn">Submit</button>
            <button type="reset" class="cancel-btn">Cancel</button>
        </div>

    </form>

</div>

</body>
</html>
